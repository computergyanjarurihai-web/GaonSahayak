<style>
/* Layout: one narrow app column; top bar, role tabs, cards per case, slide-up sheets for actions */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --sunk:#e9eee7; --ink:#16241b; --muted:#5a695f; --line:#d5ded3;
  --green:#1e5a3d; --green-soft:#e1ede4; --turmeric:#b97d06; --turmeric-soft:#fbefd2;
  --ok:#2c7a4c; --ok-soft:#dff0e5; --warn:#a96200; --warn-soft:#fdebd0; --crit:#b3261e; --crit-soft:#fbe1de; --info:#2d5b8a; --info-soft:#e0eaf5;
  --wa:#1f8f4e; --on-accent:#ffffff;
  --display:"Yatra One", "Mukta", serif;
  --body:"Mukta", "Noto Sans Devanagari", system-ui, sans-serif;
  --shadow:0 10px 30px rgba(20,40,28,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1511; --surface:#16201a; --sunk:#1c2820; --ink:#e5ede7; --muted:#9db0a3; --line:#2a3a30;
  --green:#79c79a; --green-soft:#1c3326; --turmeric:#e6b54e; --turmeric-soft:#382c10;
  --ok:#73d19c; --ok-soft:#173225; --warn:#f2b35e; --warn-soft:#3a2a12; --crit:#f2928a; --crit-soft:#3d1c19; --info:#8eb8f2; --info-soft:#18273a;
  --wa:#4cc27f; --on-accent:#0e1511; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) 72px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--green);line-height:1.1}
.brand span{color:var(--muted);font-size:14px}
.barr{display:flex;gap:8px;align-items:center}
.check{display:flex;flex-direction:row;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;color:var(--ink);font-weight:400}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
.check a,.notice a,.panel small a{color:var(--green)}
.app-foot{margin:36px 0 12px;font-size:14px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.app-foot a{color:var(--muted)}
.qrbox{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.qrbox #pp-qr{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);line-height:0}
.qrbox small{flex:1 1 180px;color:var(--muted);font-size:14px}
.lock{border:1px dashed var(--line);background:transparent;color:var(--green);border-radius:8px;padding:2px 8px;font:600 13px/1.4 var(--body);cursor:pointer}
.svc-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.svc-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px 16px;font:500 15.5px/1.35 var(--body);cursor:pointer}
.svc-btn b{white-space:nowrap;font-variant-numeric:tabular-nums}
@media (hover:hover){.svc-btn:hover{border-color:var(--green)}}
.svc-btn[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:600 13.5px/1 var(--body);padding:8px 12px;cursor:pointer}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin:16px 0 6px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 15px/1.2 var(--body);padding:10px 6px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.notice{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin:10px 0}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice b{color:inherit}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:26px 0 2px;text-wrap:balance;line-height:1.25}
:root[lang="en"] h2{font-family:var(--body);font-weight:700;font-size:22px}
p.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
h3{font-size:17px;margin:0;font-weight:700;overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:16px/1.4 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%}
input[type=file]{padding:8px;background:var(--sunk)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.phone{display:flex;gap:8px}
.phone span{display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);font-weight:600}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.fee{font-size:15px;color:var(--muted)} .fee b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;background:var(--green);color:var(--on-accent);font:600 15px/1.1 var(--body);padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.warm{background:var(--turmeric)}
.btn.wa{background:var(--wa)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.list{display:flex;flex-direction:column;gap:12px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.case .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.code{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.ex{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--turmeric);background:var(--turmeric-soft);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.s-posted{background:var(--info-soft);color:var(--info)}
.s-assigned,.s-in_progress{background:var(--green-soft);color:var(--green)}
.s-escalated{background:var(--warn-soft);color:var(--warn)}
.s-resolved{background:var(--turmeric-soft);color:var(--turmeric)}
.s-closed{background:var(--ok-soft);color:var(--ok)}
.desc{margin:0;font-size:15px;overflow-wrap:anywhere}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.files{display:flex;flex-wrap:wrap;gap:8px}
.files a{font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-decoration:none;color:var(--green);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay{background:var(--turmeric-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pay .line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14.5px}
.pay .ok{color:var(--ok);font-weight:600}
.pay .wait{color:var(--warn);font-weight:600}
details summary{cursor:pointer;color:var(--green);font-weight:600;font-size:14px}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tl li{position:relative;font-size:14.5px;overflow-wrap:anywhere}
.tl li::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--green)}
.tl .when,.tl .ref{color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:24px 12px;border:1px dashed var(--line);border-radius:14px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:13px;color:var(--muted)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow small{display:block;color:var(--muted);font-size:13px}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:2px}
.stars button.on{color:var(--turmeric)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet form{display:flex;flex-direction:column;gap:12px}
.upi{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:8px;padding:8px 12px;word-break:break-all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>

function loadScript(src){ return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error("load "+src)); document.head.appendChild(s); }); }
const FB_V = "10.12.2";
function firebaseBackend(){
  let auth, fs, st, confirmation = null, verifier = null;
  const FV = () => firebase.firestore.FieldValue;
  const snapList = q => cb => q.onSnapshot(s => cb(s.docs.map(d=>({id:d.id, ...d.data()}))), e => { console.error(e); toast(t("failed")); });
  return {
    mode:"live",
    async init(){
      for (const m of ["app","auth","firestore","storage"].concat(CONFIG.appCheckKey ? ["app-check"] : [])) await loadScript(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${m}-compat.js`);
      firebase.initializeApp(CONFIG.firebase);
      if (CONFIG.appCheckKey) firebase.appCheck().activate(CONFIG.appCheckKey, true);
      auth = firebase.auth(); fs = firebase.firestore(); st = firebase.storage();
      auth.languageCode = "hi";
    },
    onAuth(cb){ auth.onAuthStateChanged(u => cb(u ? {uid:u.uid, phone:u.phoneNumber} : null)); },
    async sendOtp(phone10){
      if (!verifier) verifier = new firebase.auth.RecaptchaVerifier("recaptcha", {size:"invisible"});
      try { confirmation = await auth.signInWithPhoneNumber("+91"+phone10, verifier); }
      catch(e){ try { verifier.clear(); } catch(_){} verifier = null; const box = document.getElementById("recaptcha"); if (box) box.innerHTML = ""; throw e; }
    },
    async verifyOtp(code){ await confirmation.confirm(code); },
    signOut(){ return auth.signOut(); },
    idToken(){ return auth.currentUser.getIdToken(); },
    async appCheckToken(){ if (!CONFIG.appCheckKey) return null; try { return (await firebase.appCheck().getToken()).token; } catch(e){ return null; } },
    async getUser(uid){ const d = await fs.collection("users").doc(uid).get(); return d.exists ? {id:d.id, ...d.data()} : null; },
    watchUser(uid, cb){ return fs.collection("users").doc(uid).onSnapshot(d => cb(d.exists ? {id:d.id, ...d.data()} : null)); },
    createUser(uid, data){ return fs.collection("users").doc(uid).set(data); },
    updateUser(uid, data){ return fs.collection("users").doc(uid).update(data); },
    watchCases(scope, cb){
      let q = fs.collection("cases");
      if (scope.owner) q = q.where("ownerUid","==",scope.owner);
      if (scope.sahayak) q = q.where("sahayakUid","==",scope.sahayak);
      if (scope.openKey) q = q.where("status","==","posted").where("blockKey","==",scope.openKey);
      else if (scope.openBlock) q = q.where("status","==","posted").where("block","==",scope.openBlock);
      return snapList(q)(cb);
    },
    watchUsers(field, value, cb){ return snapList(fs.collection("users").where(field,"==",value))(cb); },
    watchAllUsers(cb){ return snapList(fs.collection("users"))(cb); },
    async createCase(data, priv){ const ref = fs.collection("cases").doc(); await ref.set(data); await ref.collection("private").doc("contact").set(priv); return ref.id; },
    getPrivate(id){ return fs.collection("cases").doc(id).collection("private").doc("contact").get().then(d => d.exists ? d.data() : null); },
    updateCase(id, patch, entry, payment, files){
      const p = {...patch};
      if (entry) p.updates = FV().arrayUnion(entry);
      if (payment) p.payments = FV().arrayUnion(payment);
      if (files && files.length) p.files = FV().arrayUnion(...files);
      return fs.collection("cases").doc(id).update(p);
    },
    setPayments(id, payments){ return fs.collection("cases").doc(id).update({payments}); },
    async uploadFile(caseId, file, by){
      const path = `cases/${caseId}/${Date.now()}-${file.name.replace(/[^\w.\-]+/g,"_")}`;
      const ref = st.ref(path);
      await ref.put(file, {contentType:file.type});
      // download URL जानबूझकर केस में सेव नहीं होता; खोलते समय बनता है ताकि Storage नियम लागू रहें
      return {name:file.name, path, type:file.type, size:file.size, at:nowIso(), by};
    },
    fileUrl(path){ return st.ref(path).getDownloadURL(); },
    queueNotification(n){ return fs.collection("notifications").add({...n, status:"queued", at:nowIso()}); },
    // DPDP: व्यक्ति के अनुरोध पर उसका डेटा हटाना। सिर्फ़ भुगतान का बिना-नाम वाला रिकॉर्ड हिसाब-किताब के लिए रहता है।
    async eraseUser(uid){
      const qs = await fs.collection("cases").where("ownerUid","==",uid).get();
      for (const d of qs.docs) {
        const c = d.data();
        for (const f of (c.files||[])) { if (f.path) { try { await st.ref(f.path).delete(); } catch(e){ console.warn(e); } } }
        try { await d.ref.collection("private").doc("contact").delete(); } catch(e){ console.warn(e); }
        try { const ns = await fs.collection("notifications").where("caseId","==",d.id).get(); for (const n of ns.docs) await n.ref.delete(); } catch(e){ console.warn(e); }
        await d.ref.set(anonCase(c));
      }
      await fs.collection("users").doc(uid).delete();
    }
  };
}

/* ===================== field encryption (vault) ===================== */
// मोबाइल नंबर और खाता/खेसरा डेटाबेस में "enc:v1:..." के रूप में रहते हैं; पढ़ने के लिए vault सर्वर अनुमति जाँचकर खोलता है
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const isEnc = v => typeof v === "string" && v.startsWith("enc:v1:");
const vaultOn = () => B.mode === "live" && !!CONFIG.vaultUrl;
async function vault(action, body){
  const h = {"Content-Type":"application/json", Authorization:"Bearer " + await B.idToken()};
  const ac = await B.appCheckToken(); if (ac) h["X-Firebase-AppCheck"] = ac;
  const r = await fetch(CONFIG.vaultUrl, {method:"POST", headers:h, body:JSON.stringify({action, ...body})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ("vault " + r.status)); e.status = r.status; throw e; }
  return j;
}
async function seal(values){ return vaultOn() ? (await vault("seal", {values})).values : values; }
async function reveal(kind, id){
  const k = kind + ":" + id; if (S.plain[k]) return S.plain[k];
  const v = (await vault("reveal", {kind, id})).values; S.plain[k] = v; return v;
}
const shown = (kind, id, field, val) => !isEnc(val) ? esc(val || "")
  : S.plain[kind+":"+id] ? esc(S.plain[kind+":"+id][field] || "")
  : `<button type="button" class="lock" data-act="reveal" data-kind="${kind}" data-id="${esc(id)}">🔒 ${LANG==="en" ? "Show" : "देखें"}</button>`;

function stopWatches(){ S.unsubs.forEach(u => { try { u(); } catch(e){} }); S.unsubs = []; S.lists = {}; }
function watchList(key, unsub){ S.unsubs.push(unsub); }

async function start(){
  $("#langBtn").addEventListener("click", () => { LANG = LANG === "en" ? "hi" : "en"; try { localStorage.setItem("gs-lang", LANG); } catch(e){} renderShell(); });
  $("#logoutBtn").addEventListener("click", () => B.signOut());
  $("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  try { await B.init(); } catch(e){ console.error(e); toast(t("failed")); }
  let userUnsub = null;
  B.onAuth(u => {
    stopWatches(); if (userUnsub) { userUnsub(); userUnsub = null; }
    S.authUser = u; S.me = null; S.view = null;
    if (!u) { renderShell(); return; }
    userUnsub = B.watchUser(u.uid, me => {
      const gate = x => !!x && !!x.consent && x.consent.version === CONFIG.privacyVersion && (x.role !== "sahayak" || utOk(x));
      const roleChanged = !S.me || !me || S.me.role !== me.role || S.me.block !== me.block || S.me.blockKey !== me.blockKey || gate(S.me) !== gate(me);
      S.me = me;
      if (roleChanged) { stopWatches(); startWatches(); renderShell(); } else renderData();
    });
  });
}
function startWatches(){
  const me = S.me, uid = S.authUser && S.authUser.uid; if (!me || !uid) return;
  const put = k => list => { S.lists[k] = list.sort((a,b)=>String(b.createdAt||b.appliedAt).localeCompare(String(a.createdAt||a.appliedAt))); renderData(); };
  watchList("mine", B.watchCases({owner:uid}, put("mine")));
  if (me.role === "sahayak") {
    watchList("open", B.watchCases(me.blockKey ? {openKey:me.blockKey} : {openBlock:me.block}, put("open")));
    watchList("assigned", B.watchCases({sahayak:uid}, put("assigned")));
  }
  if (me.role === "admin") {
    watchList("all", B.watchCases({}, put("all")));
    watchList("apps", B.watchUsers("applied", true, put("apps")));
    watchList("sahayaks", B.watchUsers("role", "sahayak", put("sahayaks")));
    watchList("dels", B.watchUsers("deleteRequested", true, put("dels")));
    watchList("users", B.watchAllUsers(put("users")));
  }
}

function findCase(id){ for (const k of ["mine","open","assigned","all"]) { const c = (S.lists[k]||[]).find(x => x.id === id); if (c) return c; } return null; }
async function uploadAll(caseId, fileList){
  const out = [];
  for (const f of fileList) {
    if (f.size > 10*1024*1024) { toast(t("tooBig") + " " + f.name); continue; }
    out.push(await B.uploadFile(caseId, f, S.me.name));
  }
  return out;
}
async function postCase(e){
  e.preventDefault();
  const btn = $("#f-submit"); btn.disabled = true; btn.textContent = t("posting");
  const me = S.me, cat = $("#f-cat").value, files = [...$("#f-files").files], loc = readLoc("f");
  if (!loc.panchayat || !loc.village) { toast(t("needVillage")); btn.disabled = false; btn.textContent = t("postBtn"); return; }
  const data = { ownerUid:S.authUser.uid, ownerName:me.name, city:me.city, category:cat, title:$("#f-title").value.trim(), description:$("#f-desc").value.trim(),
    ...loc, land:$("#f-land").value.trim(), fee:CATS[cat].fee, status:"posted", createdAt:nowIso(),
    files:[], payments:[], updates:[{at:nowIso(), by:"system", kind:"posted", text: LANG==="en" ? `Case posted from ${me.city}.` : `${me.city} से केस भेजा गया।`}] };
  try {
    const sv = await seal({land:data.land, phone:S.authUser.phone || me.phone});
    data.land = sv.land;
    const id = await B.createCase(data, {phone:sv.phone, name:me.name});
    if (files.length) { toast(t("uploading")); const up = await uploadAll(id, files); if (up.length) await B.updateCase(id, {}, null, null, up); }
    $("#caseForm").reset(); bindLoc("f", {state:me.state, district:me.district, subdivision:me.subdivision, block:me.block, panchayat:me.panchayat, village:me.village}, setCats); $("#f-cat").dispatchEvent(new Event("change"));
    toast(t("posted"));
    openPay({...data, id}, "full");
  } catch(err){ console.error(err); toast(t("failed")); }
  finally { btn.disabled = false; btn.textContent = t("postBtn"); }
}
function waText(c, extra){
  const last = (c.updates||[]).slice(-1)[0] || {};
  const next = (c.updates||[]).filter(u=>u.next).slice(-1)[0];
  const lines = [`ग्राम सहायक: आपका केस ${code(c.id)} (${c.title})`, `स्थिति: ${STATUS[c.status] ? STATUS[c.status][0] : c.status}`];
  if (extra || last.text) lines.push(extra || last.text);
  if (next) lines.push(`अगली तारीख: ${new Date(next.next).toLocaleDateString("hi-IN",{day:"numeric",month:"long"})}`);
  lines.push(`पूरा विवरण: ${siteBase()}app.html`);
  return lines.join("\n");
}
async function openWhatsApp(c, title){
  let p = S.privCache[c.id];
  if (!p) { try { p = await B.getPrivate(c.id); S.privCache[c.id] = p; } catch(e){ p = null; } }
  if (p && isEnc(p.phone)) { try { const v = await reveal("case", c.id); p = {...p, phone:v.phone}; S.privCache[c.id] = p; } catch(e){ console.error(e); p = {...p, phone:""}; } }
  const num = p && p.phone ? p.phone.replace(/\D/g,"") : "";
  const url = `https://wa.me/${num}?text=${encodeURIComponent(waText(c))}`;
  openSheet(title || t("waFamily"), `<pre style="white-space:pre-wrap;font:15px/1.5 var(--body);background:var(--sunk);border-radius:10px;padding:12px;margin:0">${esc(waText(c))}</pre>
    <a class="btn wa block" href="${esc(url)}" target="_blank" rel="noopener">${t("waFamily")}${num?" · +"+esc(num):""}</a>
    <button class="btn ghost block" type="button" id="wa-x">${t("cancel")}</button>`, () => { $("#wa-x").onclick = closeSheet; });
}
async function acceptCase(c){
  try { await B.updateCase(c.id, {status:"assigned", sahayakUid:S.authUser.uid, sahayakName:S.me.name}, {at:nowIso(), by:S.me.name, kind:"visit", text: LANG==="en" ? `${S.me.name} accepted the case.` : `${S.me.name} ${TXT.accepted[0]}`}); toast("✓"); }
  catch(e){ console.error(e); toast(t("failed")); }
}
async function assignCase(c, uid){
  const s = (S.lists.sahayaks||[]).find(u => u.id === uid); if (!s) return;
  try { await B.updateCase(c.id, {status: c.status==="posted"?"assigned":c.status, sahayakUid:s.id, sahayakName:s.name}, {at:nowIso(), by:"system", kind:"visit", text:`${TXT.assignedTo[0]} ${s.name}`}); toast("✓"); }
  catch(e){ console.error(e); toast(t("failed")); }
}

    ${locFields("a", false)}
    <label>${t("occ")}<input id="a-occ" required maxlength="60" placeholder="${esc(t("occPh"))}"></label>
    <label class="check"><input type="checkbox" id="a-undertake" required><span>${LANG==="en"
      ? "I will keep every family's details, phone number and papers confidential, use them only for their case, never share them with anyone, and delete copies on my phone when the case closes."
      : "मैं हर परिवार की जानकारी, मोबाइल नंबर और काग़ज़ गोपनीय रखूँगा, उन्हें सिर्फ़ उसी केस के लिए इस्तेमाल करूँगा, किसी और को नहीं दूँगा, और केस बंद होने पर अपने फ़ोन से उनकी कॉपी हटा दूँगा।"}</span></label>
    <div class="actions"><button class="btn" type="submit">${t("submit")}</button><button class="btn ghost" type="button" id="a-x">${t("cancel")}</button></div></form>`, () => {
    $("#a-x").onclick = closeSheet;
    bindLoc("a", {state:S.me.state, district:S.me.district, subdivision:S.me.subdivision, block:S.me.block});
    $("#aForm").onsubmit = async ev => { ev.preventDefault(); try { await B.updateUser(S.authUser.uid, {applied:true, appliedBlock:readLoc("a").block, appliedBlockKey:readLoc("a").blockKey, occupation:$("#a-occ").value.trim(), undertaking:{version:CONFIG.privacyVersion, at:nowIso()}, appliedAt:nowIso()}); closeSheet(); toast(t("applied")); } catch(e){ console.error(e); toast(t("failed")); } };
  });
}
function openFile(path){
  const w = window.open("", "_blank");
  B.fileUrl(path).then(u => { if (w) w.location = u; else location.href = u; }).catch(e => { console.error(e); if (w) w.close(); toast(t("failed")); });
}
function openAskDelete(){
  openSheet(LANG==="en" ? "Delete my data" : "मेरा डेटा हटाएँ", `<p style="color:var(--muted)">${LANG==="en"
    ? "Your profile, cases, uploaded files and phone number will be deleted within 30 days. Open cases will stop. A payment record without your name is kept for accounts. Fees already paid for work done are not refunded."
    : "30 दिन के अंदर आपकी प्रोफ़ाइल, केस, अपलोड की गई फ़ाइलें और मोबाइल नंबर हटा दिए जाएँगे। चल रहे केस बंद हो जाएँगे। हिसाब-किताब के लिए आपके नाम के बिना सिर्फ़ भुगतान का रिकॉर्ड रहेगा। हो चुके काम का शुल्क वापस नहीं होता।"}</p>
    <div class="actions"><button class="btn warm" id="d-yes" type="button">${LANG==="en" ? "Yes, delete" : "हाँ, हटाएँ"}</button><button class="btn ghost" id="d-no" type="button">${t("cancel")}</button></div>`, () => {
    $("#d-no").onclick = closeSheet;
    $("#d-yes").onclick = async () => { try { await B.updateUser(S.authUser.uid, {deleteRequested:true, deleteRequestedAt:nowIso()}); closeSheet(); } catch(e){ console.error(e); toast(t("failed")); } };
  });
}
function openErase(uid){
  const u = (S.lists.dels||[]).find(x => x.id === uid); if (!u) return;
  openSheet(LANG==="en" ? "Delete this person's data?" : "इस व्यक्ति का डेटा हटाएँ?", `<p><b>${esc(u.name||"")}</b> · ${isEnc(u.phone) ? esc((S.plain["user:"+u.id]||{}).phone || "🔒") : esc(u.phone||"")}</p><p style="color:var(--muted)">${LANG==="en" ? "This cannot be undone." : "यह वापस नहीं होगा।"}</p>
    <div class="actions"><button class="btn warm" id="e-yes" type="button">${LANG==="en" ? "Delete" : "हटाएँ"}</button><button class="btn ghost" id="e-no" type="button">${t("cancel")}</button></div>`, () => {
    $("#e-no").onclick = closeSheet;
    $("#e-yes").onclick = async () => { $("#e-yes").disabled = true; try { await B.eraseUser(uid); closeSheet(); toast(LANG==="en" ? "Data deleted." : "डेटा हटा दिया गया।"); } catch(e){ console.error(e); toast(t("failed")); $("#e-yes").disabled = false; } };
  });
}
async function approve(uid){
  const u = (S.lists.apps||[]).find(x => x.id === uid); if (!u) return;
  try { await B.updateUser(uid, {role:"sahayak", block:u.appliedBlock||u.block, blockKey:u.appliedBlockKey || u.blockKey || makeKey({state:stOf(u), district:u.district, block:u.appliedBlock||u.block}), applied:false, approvedAt:nowIso()}); toast(t("approved")); } catch(e){ console.error(e); toast(t("failed")); }
}
async function verifyPay(c, i){
  const pays = (c.payments||[]).map((p,j) => j === i ? {...p, verified:true, verifiedAt:nowIso()} : p);
  try { await B.setPayments(c.id, pays); toast(t("payVerified")); } catch(e){ console.error(e); toast(t("failed")); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const c = b.dataset.id ? findCase(b.dataset.id) : null;
  switch (b.dataset.act) {
    case "accept": if (c) acceptCase(c); break;
    case "update": if (c) openUpdate(c); break;
    case "wa": if (c) openWhatsApp(c); break;
    case "addfiles": if (c) openAddFiles(c); break;
    case "pay": if (c) openPay(c, b.dataset.part); break;
    case "rate": if (c) openRate(c); break;
    case "apply": openApply(); break;
    case "approve": approve(b.dataset.uid); break;
    case "askdelete": openAskDelete(); break;
    case "appoint": openAppoint(b.dataset.uid); break;
    case "rmsah": openRemoveSahayak(b.dataset.uid); break;
    case "reveal": reveal(b.dataset.kind, b.dataset.id).then(renderData).catch(err => { console.error(err); toast(err.status === 403 ? (LANG==="en" ? "Visible after the case is accepted." : "केस लेने के बाद दिखेगा।") : t("failed")); }); break;
    case "migrate": b.disabled = true; vault("migrate", {}).then(r => toast((LANG==="en" ? "Encrypted: " : "एन्क्रिप्ट हुए: ") + r.encrypted)).catch(err => { console.error(err); toast(t("failed")); }).finally(() => { b.disabled = false; }); break;
    case "openfile": e.preventDefault(); openFile(b.dataset.path); break;
    case "erase": openErase(b.dataset.uid); break;
    case "verifypay": if (c) verifyPay(c, Number(b.dataset.i)); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "ap-q") { S.apQuery = e.target.value; renderAppoint(); } });
document.addEventListener("change", e => {
  const s = e.target.closest("select[data-act='assign']"); if (!s || !s.value) return;
  const c = findCase(s.dataset.id); if (c) assignCase(c, s.value);
});

start();
</script>
</body>
</html>
